name: Verified provider isolated integration
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verified-provider-integration
  cancel-in-progress: false
jobs:
  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: .
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.22.1'
      - name: Install only on this ephemeral runner
        run: |
          mkdir -p evidence
          npm ci --ignore-scripts --no-audit --no-fund
          npm ls --all --json > evidence/dependencies.json
      - name: Run unit and actual-package integration tests without network
        run: |
          set -o pipefail
          node --test --test-reporter=tap test/*.test.mjs | tee evidence/unit.tap
          node --import ./test/integration/no-network.mjs --experimental-test-module-mocks --test --test-timeout=15000 --test-concurrency=1 --test-reporter=tap test/integration/*.test.mjs | tee evidence/integration.tap
      - name: Keep bounded evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verified-provider-evidence
          path: |
            evidence/
            package-lock.json
          retention-days: 3
          if-no-files-found: error

